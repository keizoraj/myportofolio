<form method="post"
      action="{% url 'main:toggle_star' project.id %}"
      class="star-form">

    {% csrf_token %}

    <button type="submit"
            class="button button-star{% if user.is_authenticated and user in project.starred_by.all %} is-starred{% endif %}"
            title="{% if user.is_authenticated %}Berikan atau batalkan star{% else %}Login untuk memberi star{% endif %}">

        <span aria-hidden="true">★</span>

        {% if user.is_authenticated and user in project.starred_by.all %}
            Unstar
        {% else %}
            Star
        {% endif %}

        <span class="star-count">
            {{ project.starred_by.count }}
        </span>
    </button>
</form>
