{% extends "base.html" %}
{% block meta %}
    <title>{{ form_title }} - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1>{{ form_title }}</h1>
                <form method="post"
                      action=""
                      class="project-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="form-error">
                                    {{ field.errors }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">{{ submit_text }}</button>
                    <a href="{% url 'main:show_projects' %}" class="button button-secondary">Batal</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
